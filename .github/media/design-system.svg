<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img"
     aria-label="JetForce Washing design system: colour palette with WCAG contrast ratios, and type scale.">
  <style>
    .t   { font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; fill: #6b7c8a; }
    .hex { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #4a5c6b; }
    .rat { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #6b7c8a; }
    .nm  { font-size: 12px; font-weight: 700; fill: #12212f; }
  </style>

  <rect width="900" height="340" rx="14" fill="#ffffff" stroke="#dfe6ec"/>

  <!-- ── Palette ───────────────────────────────────────────────── -->
  <text class="t lbl" x="32" y="40">Palette — contrast measured against its own background</text>

  <g transform="translate(32,58)">
    <rect width="150" height="62" rx="10" fill="#0b1b2b"/>
    <text class="t" x="14" y="26" font-size="12" font-weight="700" fill="#ffffff">Navy</text>
    <text class="t" x="14" y="44" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#a9bccd">#0b1b2b</text>
  </g>
  <text class="t nm" x="32" y="140">Surface / footer</text>
  <text class="t rat" x="32" y="156">17.4:1 with white</text>

  <g transform="translate(202,58)">
    <rect width="150" height="62" rx="10" fill="#0d7a9b"/>
    <text class="t" x="14" y="26" font-size="12" font-weight="700" fill="#ffffff">Brand deep</text>
    <text class="t" x="14" y="44" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#d6eef6">#0d7a9b</text>
  </g>
  <text class="t nm" x="202" y="140">Buttons, links</text>
  <text class="t rat" x="202" y="156">4.91:1 — AA pass</text>

  <g transform="translate(372,58)">
    <rect width="150" height="62" rx="10" fill="#1596bd"/>
    <text class="t" x="14" y="26" font-size="12" font-weight="700" fill="#ffffff">Brand</text>
    <text class="t" x="14" y="44" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#e2f4fa">#1596bd</text>
  </g>
  <text class="t nm" x="372" y="140">Accents only</text>
  <text class="t rat" x="372" y="156">3.43:1 — large text only</text>

  <g transform="translate(542,58)">
    <rect width="150" height="62" rx="10" fill="#e7f6fb" stroke="#c9e6f0"/>
    <text class="t" x="14" y="26" font-size="12" font-weight="700" fill="#0d7a9b">Tint</text>
    <text class="t" x="14" y="44" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#0d7a9b">#e7f6fb</text>
  </g>
  <text class="t nm" x="542" y="140">Icon wells, hero</text>

  <g transform="translate(712,58)">
    <rect width="150" height="62" rx="10" fill="#4a5c6b"/>
    <text class="t" x="14" y="26" font-size="12" font-weight="700" fill="#ffffff">Body</text>
    <text class="t" x="14" y="44" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#dfe6ec">#4a5c6b</text>
  </g>
  <text class="t nm" x="712" y="140">Body copy</text>
  <text class="t rat" x="712" y="156">6.92:1 — AA pass</text>

  <line x1="32" y1="182" x2="868" y2="182" stroke="#dfe6ec"/>

  <!-- ── Type scale ────────────────────────────────────────────── -->
  <text class="t lbl" x="32" y="210">Type — Plus Jakarta Sans, fluid clamp() sizing</text>

  <text class="t" x="32" y="252" font-size="30" font-weight="800" fill="#12212f" letter-spacing="-.02em">Driveways and patios</text>
  <text class="t rat" x="32" y="270">h1 · clamp(2.3rem, 5.4vw, 3.7rem) · 800</text>

  <text class="t" x="420" y="246" font-size="17" font-weight="800" fill="#12212f">Section heading</text>
  <text class="t rat" x="420" y="262">h2 · clamp(1.85rem, 3.6vw, 2.6rem)</text>

  <text class="t" x="420" y="290" font-size="13" fill="#4a5c6b">Body copy at 17px / 1.65 line height</text>
  <text class="t rat" x="420" y="306">body · 17px · 1.65</text>

  <text class="t" x="32" y="296" font-size="10" font-weight="700" letter-spacing=".12em" fill="#0d7a9b">KICKER LABEL</text>
  <text class="t rat" x="32" y="312">.kicker · .78rem · uppercase</text>
</svg>
