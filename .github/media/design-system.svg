<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>JetForce Washing design system: palette, contrast ratios and type scale</title>

  <rect width="920" height="470" rx="14" fill="#f9f6f0"/>
  <rect x="0.5" y="0.5" width="919" height="469" rx="14" fill="none" stroke="#2c3238" stroke-opacity=".14"/>

  <!-- ── header ─────────────────────────────────────────────── -->
  <text x="40" y="46" font-size="11" letter-spacing="3.2" fill="#c74405" font-weight="600">DESIGN SYSTEM</text>
  <text x="40" y="78" font-size="26" fill="#2c3238" font-family="Georgia, 'Times New Roman', serif">Warm stone, editorial serif</text>

  <line x1="40" y1="104" x2="880" y2="104" stroke="#2c3238" stroke-opacity=".14"/>

  <!-- ── palette ────────────────────────────────────────────── -->
  <text x="40" y="134" font-size="10.5" letter-spacing="2.4" fill="#2c3238" fill-opacity=".62" font-weight="600">PALETTE</text>

  <!-- sand -->
  <rect x="40" y="150" width="150" height="76" rx="10" fill="#f9f6f0" stroke="#2c3238" stroke-opacity=".2"/>
  <text x="56" y="180" font-size="13" fill="#2c3238" font-weight="600">Sand</text>
  <text x="56" y="199" font-size="11.5" fill="#2c3238" fill-opacity=".74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#f9f6f0</text>
  <text x="56" y="216" font-size="10" fill="#2c3238" fill-opacity=".62">page ground</text>

  <!-- charcoal -->
  <rect x="204" y="150" width="150" height="76" rx="10" fill="#2c3238"/>
  <text x="220" y="180" font-size="13" fill="#f9f6f0" font-weight="600">Charcoal</text>
  <text x="220" y="199" font-size="11.5" fill="#f9f6f0" fill-opacity=".8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#2c3238</text>
  <text x="220" y="216" font-size="10" fill="#f9f6f0" fill-opacity=".62">body text · footer</text>

  <!-- sat-ink -->
  <rect x="368" y="150" width="150" height="76" rx="10" fill="#c74405"/>
  <text x="384" y="180" font-size="13" fill="#ffffff" font-weight="600">Ink orange</text>
  <text x="384" y="199" font-size="11.5" fill="#ffffff" fill-opacity=".88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#c74405</text>
  <text x="384" y="216" font-size="10" fill="#ffffff" fill-opacity=".8">all text &amp; buttons</text>

  <!-- sat -->
  <rect x="532" y="150" width="150" height="76" rx="10" fill="#ff7a3d"/>
  <text x="548" y="180" font-size="13" fill="#2c3238" font-weight="600">Bright orange</text>
  <text x="548" y="199" font-size="11.5" fill="#2c3238" fill-opacity=".85" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#ff7a3d</text>
  <text x="548" y="216" font-size="10" fill="#2c3238" fill-opacity=".78">decoration only</text>

  <!-- steel -->
  <rect x="696" y="150" width="150" height="76" rx="10" fill="#c4ccd3"/>
  <text x="712" y="180" font-size="13" fill="#2c3238" font-weight="600">Steel</text>
  <text x="712" y="199" font-size="11.5" fill="#2c3238" fill-opacity=".85" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#c4ccd3</text>
  <text x="712" y="216" font-size="10" fill="#2c3238" fill-opacity=".78">section tints</text>

  <!-- ── contrast ───────────────────────────────────────────── -->
  <text x="40" y="270" font-size="10.5" letter-spacing="2.4" fill="#2c3238" fill-opacity=".62" font-weight="600">MEASURED CONTRAST</text>

  <g font-size="12">
    <!-- pass rows -->
    <circle cx="46" cy="292" r="4" fill="#1f6b46"/>
    <text x="58" y="296" fill="#2c3238">Charcoal on sand</text>
    <text x="250" y="296" fill="#2c3238" font-weight="700">12.01:1</text>

    <circle cx="46" cy="316" r="4" fill="#1f6b46"/>
    <text x="58" y="320" fill="#2c3238">Ink orange on sand</text>
    <text x="250" y="320" fill="#2c3238" font-weight="700">4.57:1</text>

    <circle cx="46" cy="340" r="4" fill="#1f6b46"/>
    <text x="58" y="344" fill="#2c3238">White on ink orange (buttons)</text>
    <text x="250" y="344" fill="#2c3238" font-weight="700">4.93:1</text>

    <!-- fail rows: why the split exists -->
    <circle cx="424" cy="292" r="4" fill="#b3261e"/>
    <text x="436" y="296" fill="#2c3238" fill-opacity=".8">Bright orange as text on sand</text>
    <text x="672" y="296" fill="#b3261e" font-weight="700">2.40:1</text>
    <text x="740" y="296" fill="#2c3238" fill-opacity=".6" font-size="11">never used</text>

    <circle cx="424" cy="316" r="4" fill="#b3261e"/>
    <text x="436" y="320" fill="#2c3238" fill-opacity=".8">White on bright orange</text>
    <text x="672" y="320" fill="#b3261e" font-weight="700">2.59:1</text>
    <text x="740" y="320" fill="#2c3238" fill-opacity=".6" font-size="11">never used</text>

    <circle cx="424" cy="340" r="4" fill="#b3261e"/>
    <text x="436" y="344" fill="#2c3238" fill-opacity=".8">Steel as text on sand</text>
    <text x="672" y="344" fill="#b3261e" font-weight="700">1.51:1</text>
    <text x="740" y="344" fill="#2c3238" fill-opacity=".6" font-size="11">fills only</text>
  </g>

  <line x1="40" y1="368" x2="880" y2="368" stroke="#2c3238" stroke-opacity=".14"/>

  <!-- ── type ───────────────────────────────────────────────── -->
  <text x="40" y="396" font-size="10.5" letter-spacing="2.4" fill="#2c3238" fill-opacity=".62" font-weight="600">TYPE</text>

  <text x="40" y="434" font-size="30" fill="#2c3238" font-family="Georgia, 'Times New Roman', serif">Playfair Display</text>
  <text x="40" y="454" font-size="10.5" fill="#2c3238" fill-opacity=".7">Display &amp; headings · 500 · italic for accents</text>

  <text x="470" y="432" font-size="24" fill="#2c3238" font-weight="300">Outfit</text>
  <text x="470" y="454" font-size="10.5" fill="#2c3238" fill-opacity=".7">Body &amp; UI · 300/400/500 · uppercase 0.18em for labels</text>

  <text x="704" y="410" font-size="26" fill="#c74405" font-family="Georgia, 'Times New Roman', serif" font-style="italic">restored.</text>
</svg>
